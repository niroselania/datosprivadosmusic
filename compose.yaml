services:
  archivo-it:
    build: .
    container_name: archivo-it
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3000"
    environment:
      APP_USER: ${APP_USER:?Definí APP_USER en Portainer}
      APP_PASSWORD: ${APP_PASSWORD:?Definí APP_PASSWORD en Portainer}
      SESSION_SECRET: ${SESSION_SECRET:?Definí SESSION_SECRET en Portainer}
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      MAX_UPLOAD_MB: "100"
      RELEVAMIENTO_URL: "http://relevamiento:8080"
    volumes:
      - archivo_it_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # Relevamiento de equipos (Liquid). Sin puertos publicados: se entra por /relevamiento/ con el mismo usuario y contraseña.
  relevamiento:
    build: ./relevamiento
    image: archivo-relevamiento:latest
    container_name: archivo-relevamiento
    restart: unless-stopped
    environment:
      APP_PASSWORD: ""
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data
  relevamiento-bot:
    build: ./relevamiento
    image: archivo-relevamiento:latest
    container_name: archivo-relevamiento-bot
    command: ["python", "bot.py"]
    restart: unless-stopped
    depends_on:
      - relevamiento
    environment:
      TELEGRAM_BOT_TOKEN: "${RELEVAMIENTO_TELEGRAM_BOT_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${RELEVAMIENTO_ALLOWED_CHAT_IDS:-}"
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data

volumes:
  archivo_it_data:
    name: archivo_it_data
  relevamiento_data:
    name: ${RELEVAMIENTO_VOLUME:-relevamiento_data}
