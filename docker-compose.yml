services:
  archivo-it:
    build: .
    container_name: archivo-it
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9090}:3000"
    environment:
      APP_USER: "${APP_USER:-}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      MAX_UPLOAD_MB: "100"
      RELEVAMIENTO_URL: "http://relevamiento:8080"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_ALLOWED_USERS: "${DISCORD_ALLOWED_USERS:-}"
      WHISPER_URL: "${WHISPER_URL:-}"
      WHISPER_TOKEN: "${WHISPER_TOKEN:-}"
    volumes:
      - archivo_it_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # Relevamiento de equipos (Liquid). Sin puertos publicados: se entra por /relevamiento/ con el mismo usuario y contraseña.
  relevamiento:
    build: ./relevamiento
    image: archivo-relevamiento:latest
    container_name: archivo-relevamiento
    restart: unless-stopped
    environment:
      APP_PASSWORD: ""
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data
  relevamiento-bot:
    build: ./relevamiento
    image: archivo-relevamiento:latest
    container_name: archivo-relevamiento-bot
    command: ["python", "bot.py"]
    restart: unless-stopped
    depends_on:
      - relevamiento
    environment:
      TELEGRAM_BOT_TOKEN: "${RELEVAMIENTO_TELEGRAM_BOT_TOKEN:-}"
      ALLOWED_CHAT_IDS: "${RELEVAMIENTO_ALLOWED_CHAT_IDS:-}"
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data

volumes:
  archivo_it_data:
    name: archivo_it_data
  relevamiento_data:
    name: ${RELEVAMIENTO_VOLUME:-relevamiento_data}
